{
"name": "Find new companies",
"on": {"workflow_dispatch": {}},
"permissions": {"contents": "write"},
"concurrency": {"group": "ashby-radar", "queue": "max"},
"jobs": {"discover": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v7", "with": {"ref": "main", "fetch-depth": 0}},
{"uses": "actions/setup-python@v7", "with": {"python-version": "3.12"}},
{"name": "Search Google for new companies", "run": "python ashby_radar.py --discover-only", "env": {
"SERPER_API_KEY": "${{ secrets.SERPER_API_KEY }}",
"NOTION_TOKEN": "${{ secrets.NOTION_TOKEN }}",
"NOTION_DATABASE_ID": "${{ secrets.NOTION_DATABASE_ID }}"}},
{"name": "Save companies.txt", "run": "git config user.name ashby-radar-bot && git config user.email actions@users.noreply.github.com && git add companies.txt && (git diff --cached --quiet || git commit -m \"discover: $(date -u +%F)\") && git pull --rebase origin main && git push origin HEAD:main"}
]}}
}
