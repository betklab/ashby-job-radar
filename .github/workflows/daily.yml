{
"name": "Ashby job radar",
"on": {"schedule": [{"cron": "40 5 * * *"}], "workflow_dispatch": {}},
"permissions": {"contents": "write"},
"concurrency": {"group": "ashby-radar", "queue": "max"},
"jobs": {"radar": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v7", "with": {"ref": "main", "fetch-depth": 0}},
{"uses": "actions/setup-python@v7", "with": {"python-version": "3.12"}},
{"name": "Run radar", "run": "python ashby_radar.py", "env": {
"SMTP_USER": "${{ secrets.SMTP_USER }}",
"SMTP_PASS": "${{ secrets.SMTP_PASS }}",
"EMAIL_TO": "${{ secrets.EMAIL_TO }}",
"NOTION_TOKEN": "${{ secrets.NOTION_TOKEN }}",
"NOTION_DATABASE_ID": "${{ secrets.NOTION_DATABASE_ID }}"}},
{"name": "Save state and digest", "if": "${{ !cancelled() }}", "run": "git config user.name ashby-radar-bot && git config user.email actions@users.noreply.github.com && git add seen.json companies.txt boards.json output/ && (git diff --cached --quiet || git commit -m \"radar: $(date -u +%F)\") && git pull --rebase origin main && git push origin HEAD:main"}
]}}
}
